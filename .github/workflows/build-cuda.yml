name: Build and test waLBerla-wind with CUDA

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.6.3-devel-rockylinux9
      #options: --gpus all
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          dnf install -y epel-release && \
          dnf install -y \
            glibc-langpack-en \
            gcc \
            gcc-c++ \
            git \
            cmake \
            xz \
            openmpi \
            openmpi-devel && \
          dnf clean all

      - name: Build
        run: |
          export PATH=/usr/lib64/openmpi/bin:$PATH
          export LD_LIBRARY_PATH=/usr/lib64/openmpi/lib:$LD_LIBRARY_PATH

          BASEDIR=${PWD}

          git clone https://github.com/lssfau/walberla.git
          git clone -b v2.13.6 https://github.com/pybind/pybind11.git

          export PATH="${HOME}/.local/bin:${PATH}"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv --version
          uv python install 3.12
          uv venv --clear --python 3.12
          uv pip install pystencils~=1.3 lbmpy~=1.3 jinja2 pyvista scipy
          source .venv/bin/activate

          mkdir build
          cd build

          export CUDAFLAGS="--expt-relaxed-constexpr"

          cmake .. \
            -DWALBERLA_DIR="${BASEDIR}/walberla" \
            -DWALBERLA_PYBIND11_SOURCE_DIR="${BASEDIR}/pybind11" \
            -DCMAKE_PYBIND11_SOURCE_DIR="${BASEDIR}/pybind11" \
            -DPython_ROOT_DIR="$(realpath `which python`)" \
            -DWALBERLA_DOUBLE_ACCURACY="OFF" \
            -DWALBERLA_BUILD_WITH_CODEGEN="ON" \
            -DWALBERLA_BUILD_WITH_PYTHON="ON" \
            -DWALBERLA_BUILD_WITH_CUDA="ON" \
            -DCMAKE_CUDA_ARCHITECTURES="89;90" 2>&1 | tee ./cmake.log

          make -j $(nproc --all) 2>&1 | tee ./build.log

      - name: Test
        run: |
          export PATH=/usr/lib64/openmpi/bin:$PATH
          export LD_LIBRARY_PATH=/usr/lib64/openmpi/lib:$LD_LIBRARY_PATH
          source .venv/bin/activate
          cd build
          ctest -L CPU --output-on-failure
