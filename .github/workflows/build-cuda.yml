name: Build waLBerla-wind with CUDA

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.6.3-devel-ubi9
      #options: --gpus all
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install base tools, compilers, Git, CMake, XZ, OpenMPI
        run: |
          dnf install -y epel-release && \
          dnf install -y \
            glibc-langpack-en \
            gcc \
            gcc-c++ \
            git \
            cmake \
            xz \
            openmpi \
            openmpi-devel && \
          dnf clean all

      - name: Setup environment and build waLBerla-wind
        run: |
          # Ajout d'OpenMPI aux variables d'environnement PATH et LD_LIBRARY_PATH
          export PATH=/usr/lib64/openmpi/bin:$PATH
          export LD_LIBRARY_PATH=/usr/lib64/openmpi/lib:$LD_LIBRARY_PATH

          BASEDIR=${PWD}

          git clone https://github.com/lssfau/walberla.git
          git clone -b v2.13.6 https://github.com/pybind/pybind11.git

          export UV_INSTALL_DIR="${PWD}/uv"
          export UV_PYTHON_INSTALL_DIR="${UV_INSTALL_DIR}/python"
          #export UV_PYTHON_INSTALL_MIRROR="https://python-standalone.org/mirror/astral-sh/python-build-standalone"
          export UV_DEFAULT_INDEX="https://repos.ifpen.fr/repository/Pypi/simple"
          export PATH="${UV_INSTALL_DIR}:${PATH}"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv --version
          uv python install 3.12
          uv venv --clear --python 3.12
          uv pip install build wheel
          source .venv/bin/activate
          uv pip install pystencils~=1.3 lbmpy~=1.3 jinja2

          mkdir build
          cd build

          cmake .. \
            -DWALBERLA_DIR="${BASEDIR}/walberla" \
            -DWALBERLA_PYBIND11_SOURCE_DIR="${BASEDIR}/pybind11" \
            -DCMAKE_PYBIND11_SOURCE_DIR="${BASEDIR}/pybind11" \
            -DPython_ROOT_DIR="$(realpath ${BASEDIR}/uv/python/cpython-3.12-linux-x86_64-gnu)" \
            -DWALBERLA_DOUBLE_ACCURACY="OFF" \
            -DWALBERLA_BUILD_WITH_CODEGEN="ON" \
            -DWALBERLA_BUILD_WITH_PYTHON="ON" \
            -DWALBERLA_BUILD_WITH_CUDA="ON" \
            -DCMAKE_CUDA_ARCHITECTURES="89;90" | tee ./cmake.log

          cd apps/GeneratedApp_cpu_staticRefinement
          LC_ALL=en_US.UTF-8 \
            make MAKEFLAGS='-j8' VERBOSE=0 -j8 2>&1 | tee ./build.log
